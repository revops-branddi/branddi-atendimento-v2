<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branddi Atendimento — Site</title>
    <meta name="description" content="Atendimento dedicado ao chat do site da Branddi." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/style-v2.css" />
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; }
        .site-shell { display: grid; grid-template-columns: 320px 1fr; width: 100%; height: 100%; }
        .site-sidebar { border-right: 1px solid var(--border, #e5e7eb); background: #f9fafb; padding: 16px; overflow-y: auto; }
        .site-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .site-header h1 { font-size: 18px; margin: 0; }
        .site-back { color: #6b7280; text-decoration: none; font-size: 13px; }
        .site-back:hover { color: #111827; }
        .conv-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; }
        .conv-item:hover { background: #f3f4f6; }
        .conv-item.active { background: #eef2ff; border-color: #6366f1; }
        .conv-item .name { font-weight: 600; font-size: 14px; }
        .conv-item .preview { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .conv-item .meta { font-size: 11px; color: #9ca3af; margin-top: 4px; display: flex; gap: 8px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .badge-bot { background: #dbeafe; color: #1e40af; }
        .badge-waiting { background: #fef3c7; color: #92400e; }
        .badge-in_progress { background: #d1fae5; color: #065f46; }
        .badge-resolved { background: #e5e7eb; color: #374151; }
        .site-main { display: flex; flex-direction: column; padding: 16px; overflow: hidden; }
        .site-empty { color: #9ca3af; text-align: center; margin-top: 80px; font-size: 14px; }
        .msg-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 60%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
        .msg.inbound { align-self: flex-start; background: #f3f4f6; }
        .msg.outbound { align-self: flex-end; background: #6366f1; color: white; }
        .msg .who { font-size: 11px; opacity: 0.6; margin-bottom: 2px; }
        .stub { padding: 12px; background: #fef3c7; border: 1px dashed #f59e0b; border-radius: 8px; font-size: 13px; color: #78350f; margin-top: 12px; }
    </style>
</head>
<body>
<div class="site-shell">
    <aside class="site-sidebar">
        <div class="site-header">
            <h1>Atendimento Site</h1>
            <a href="/" class="site-back">← Voltar</a>
        </div>
        <div id="conv-list">
            <div class="site-empty">Carregando…</div>
        </div>
    </aside>
    <main class="site-main">
        <div id="conv-viewer" class="site-empty">Selecione uma conversa</div>
    </main>
</div>
<script src="app.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branddi Atendimento — Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#177A8B">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://atendimento.branddi.com/">
  <meta property="og:title" content="Branddi Atendimento — WhatsApp Inbox">
  <meta property="og:description" content="Inbox central da Branddi para o time comercial. Conversas, tags e CRM sincronizados em um só lugar.">
  <meta property="og:image" content="https://atendimento.branddi.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Visual refresh: Geist substitui DM Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Visual refresh 07/08/26 — light + Azul Branddi (paleta oficial) */
      --bg-base: #F6F7F8;
      --bg-elevated: #FFFFFF;
      --bg-input: #F1F3F5;
      --accent: #177A8B;
      --accent-dim: rgba(23, 122, 139, 0.12);
      --accent-mid: rgba(23, 122, 139, 0.30);
      --text-1: #0E1620;
      --text-2: #5A6672;
      --text-3: #8A95A0;
      --border-md: #E4E7EB;
      --border-strong: #D1D6DB;
      --red: #E11D48;
      --radius: 10px;
      --radius-sm: 7px;
      --radius-xl: 18px;
      --font: 'Geist', 'DM Sans', system-ui, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(23, 122, 139, 0.08) 0%, transparent 60%);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-md);
      border-radius: var(--radius-xl);
      box-shadow: 0 12px 32px rgba(15, 22, 32, 0.10);
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes softFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 32px; }
    .logo-sub { font-size: 13px; color: var(--text-3); }
    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: -0.01em;
    }
    .subtitle { font-size: 13px; color: var(--text-3); text-align: center; margin-bottom: 28px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-3);
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-md);
      border-radius: var(--radius);
      color: var(--text-1);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s var(--ease);
      outline: none;
    }
    .field input::placeholder { color: var(--text-3); }
    .field input:focus { border-color: var(--accent-mid); }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(23, 122, 139, 0.25);
      transition: all 0.2s var(--ease);
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(23, 122, 139, 0.35); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .error-msg {
      display: none;
      background: rgba(225, 29, 72, 0.10);
      border: 1px solid rgba(225, 29, 72, 0.30);
      color: var(--red);
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .error-msg.show { display: block; }
    .footer-note { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 22px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-md); }
    .divider span { font-size: 12px; color: var(--text-3); }
    .btn-google {
      width: 100%;
      padding: 12px;
      background: #FFFFFF;
      border: 1px solid #dadce0;
      border-radius: var(--radius);
      color: #3c4043;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s var(--ease);
      margin-bottom: 12px;
    }
    .btn-google:hover { background: #f7f8f8; box-shadow: 0 2px 8px rgba(15, 22, 32, 0.08); }
    .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
    .email-form { display: none; animation: softFade 0.2s ease; }
    .email-form.show { display: block; }
    .toggle-email {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      display: block;
      text-align: center;
      width: 100%;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .toggle-email:hover { color: #115F6D; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="/logo-branddi-dark.svg" alt="Branddi" style="width:160px;height:auto" />
      <div class="logo-sub">Atendimento</div>
    </div>
    <h2>Bem-vindo</h2>
    <p class="subtitle" id="login-subtitle">Entre com sua conta Google institucional</p>
    <div id="error-msg" class="error-msg"></div>

    <div id="google-btn-wrap"></div>

    <button class="toggle-email" id="toggle-email">Entrar com e-mail e senha</button>

    <div class="email-form" id="email-form">
      <div class="divider"><span>ou</span></div>
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="........" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Entrar</button>
      </form>
    </div>

    <p class="footer-note">Apenas contas @branddi.com sao aceitas</p>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const API = '';

    document.getElementById('toggle-email').addEventListener('click', function() {
      document.getElementById('email-form').classList.toggle('show');
    });

    // Renderiza o botão oficial do Google Identity Services direto.
    // Não usa prompt() — Chrome moderno (FedCM) não dispara mais o
    // notification callback, então fallback pro renderButton ficava preso.
    async function initGoogleLogin() {
      const wrap = document.getElementById('google-btn-wrap');

      // Espera o script GIS carregar (async defer pode não estar pronto).
      const start = Date.now();
      while (!(window.google && window.google.accounts && window.google.accounts.id)) {
        if (Date.now() - start > 10000) {
          wrap.style.display = 'none';
          document.getElementById('email-form').classList.add('show');
          document.getElementById('login-subtitle').textContent = 'Entre com suas credenciais';
          document.getElementById('toggle-email').style.display = 'none';
          return;
        }
        await new Promise(r => setTimeout(r, 100));
      }

      try {
        const res = await fetch(API + '/api/auth/google-client-id');
        const data = await res.json();
        if (!data.client_id) {
          wrap.style.display = 'none';
          document.getElementById('email-form').classList.add('show');
          document.getElementById('login-subtitle').textContent = 'Entre com suas credenciais';
          document.getElementById('toggle-email').style.display = 'none';
          return;
        }

        google.accounts.id.initialize({
          client_id: data.client_id,
          callback: handleGoogleResponse,
          auto_select: false,
          use_fedcm_for_prompt: true,
        });

        wrap.replaceChildren();
        google.accounts.id.renderButton(wrap, {
          theme: 'filled_blue',
          size: 'large',
          width: 340,
          text: 'continue_with',
        });
      } catch (e) {
        wrap.style.display = 'none';
        document.getElementById('email-form').classList.add('show');
        document.getElementById('toggle-email').style.display = 'none';
      }
    }

    async function handleGoogleResponse(response) {
      var err = document.getElementById('error-msg');
      err.classList.remove('show');
      try {
        var res = await fetch(API + '/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential }),
        });
        var data = await res.json();
        if (!res.ok) { err.textContent = data.error; err.classList.add('show'); return; }
        localStorage.setItem('ba_token', data.token);
        localStorage.setItem('ba_user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (e) {
        err.textContent = 'Erro de conexao.'; err.classList.add('show');
      }
    }

    initGoogleLogin();

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('btn-login');
      var err = document.getElementById('error-msg');
      var email = document.getElementById('email').value.trim();
      var pass = document.getElementById('password').value;
      btn.disabled = true; btn.textContent = 'Entrando...'; err.classList.remove('show');
      try {
        var res = await fetch(API + '/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: pass }),
        });
        var data = await res.json();
        if (!res.ok) { err.textContent = data.error || 'Erro ao fazer login.'; err.classList.add('show'); return; }
        localStorage.setItem('ba_token', data.token);
        localStorage.setItem('ba_user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (e) {
        err.textContent = 'Erro de conexao. Tente novamente.'; err.classList.add('show');
      } finally {
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OG Image Source</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0f1923;
  }
  .canvas {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(circle at 85% 15%, rgba(37, 211, 102, 0.10) 0%, transparent 40%),
      radial-gradient(circle at 10% 90%, rgba(18, 140, 126, 0.08) 0%, transparent 35%),
      #0f1923;
    display: grid;
    grid-template-columns: 480px 1fr;
    align-items: center;
    padding: 0 80px;
    position: relative;
  }
  .mark { display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 320px; height: auto; filter: drop-shadow(0 12px 40px rgba(37, 211, 102, 0.25)); }
  .text { color: #ECF2F8; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    color: #25D366;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 20px;
  }
  .eyebrow::before {
    content: "";
    width: 32px;
    height: 2px;
    background: #25D366;
    border-radius: 2px;
  }
  h1 {
    font-size: 88px;
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    margin-bottom: 24px;
  }
  h1 .accent {
    background: linear-gradient(120deg, #25D366 0%, #128C7E 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 30px;
    font-weight: 400;
    line-height: 1.35;
    color: #8DA4B8;
    max-width: 580px;
  }
  .footer {
    position: absolute;
    bottom: 50px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 500;
    color: #546A7B;
    letter-spacing: 0.04em;
  }
  .footer .domain { color: #8DA4B8; }
  .footer .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(37, 211, 102, 0.10);
    border: 1px solid rgba(37, 211, 102, 0.30);
    border-radius: 100px;
    color: #25D366;
    font-size: 16px;
    font-weight: 600;
  }
  .footer .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #25D366;
    box-shadow: 0 0 12px rgba(37, 211, 102, 0.8);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="mark">
      <svg viewBox="0 0 135 203" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#25D366"/>
            <stop offset="100%" stop-color="#128C7E"/>
          </linearGradient>
        </defs>
        <path fill="url(#g)" d="M116.741 70.6442L50.032 3.7007C47.6645 1.32383 44.5179 0 41.1614 0C37.805 0 34.6583 1.32383 32.2908 3.7007L3.64115 32.5541C-1.21372 37.4583 -1.21372 45.4313 3.64115 50.3355L39.0037 85.9284L45.8664 92.8484C49.6125 96.7297 49.5825 102.928 45.7765 106.779L6.27835 146.433C3.91086 148.81 2.59226 151.969 2.59226 155.339C2.59226 158.709 3.91086 161.868 6.27835 164.245L43.8885 202.004L74.8757 170.894L116.741 128.863C132.715 112.826 132.715 86.7107 116.741 70.6743V70.6442ZM70.0508 162.109L43.9485 188.405L14.13 158.468C13.2909 157.626 12.8114 156.482 12.8114 155.279C12.8114 154.075 13.2909 152.932 14.13 152.09L53.6282 112.435C55.696 110.359 57.1945 107.802 58.0336 104.973L71.3695 118.362C83.9861 131.029 82.218 149.021 70.0508 162.139V162.109ZM109.999 122.093L89.8299 142.342C90.0097 130.517 85.4845 119.114 77.0035 110.6L52.7592 86.2594L10.384 43.596C9.21524 42.4226 9.21524 40.4971 10.384 39.3237L39.0337 10.4703C40.1725 9.32697 42.1504 9.32697 43.2892 10.4703L109.999 77.4439C122.256 89.7495 122.256 109.787 109.999 122.093Z"/>
      </svg>
    </div>
    <div class="text">
      <div class="eyebrow">Branddi</div>
      <h1>Atendimento<br><span class="accent">WhatsApp</span></h1>
      <p>Inbox central da Branddi para o time comercial. Conversas, tags e CRM sincronizados em um só lugar.</p>
    </div>
    <div class="footer">
      <span class="domain">atendimento.branddi.com</span>
      <span class="badge"><span class="dot"></span>Plataforma interna</span>
    </div>
  </div>
</body>
</html>

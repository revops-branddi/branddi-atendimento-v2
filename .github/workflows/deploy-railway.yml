name: Deploy to Railway (manual fallback)

# Fallback manual de deploy. O caminho normal é auto-deploy nativo do
# Railway (Settings → Source → "Auto deploys when pushed to GitHub" ON).
# Este workflow só roda quando disparado a mão via Actions → Run workflow,
# pra casos onde a source connection do dashboard cair.
#
# Setup necessário pra usar:
#   1. Railway: Project Settings → Tokens → Create Token (Project Token —
#      sem dropdown de workspace, escopado ao projeto)
#   2. GitHub: Settings → Secrets and variables → Actions → New secret
#      name=RAILWAY_TOKEN, value=token do passo 1
#   3. Actions tab → "Deploy to Railway (manual fallback)" → Run workflow
#
# Desativado em push pra evitar duplicação com o auto-deploy nativo (que
# dispararia o mesmo deploy em paralelo).

on:
  workflow_dispatch:

concurrency:
  group: deploy-railway-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          # Aceita Project Token (RAILWAY_TOKEN) ou Account/API Token
          # (RAILWAY_API_TOKEN). railway CLI usa o que estiver setado.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link \
            --project b43bc2f7-0b90-4f6e-b98e-4280840d4164 \
            --environment production \
            --service "Atendimento Branddi"
          railway up --service "Atendimento Branddi" --environment production --ci
